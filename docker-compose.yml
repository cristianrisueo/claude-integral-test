# The local stack: `make up` / `make down` (which keeps the pgdata volume).
# The password "app" only works on this machine.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: src/api
    ports:
      - "8080:8080"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: app
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
