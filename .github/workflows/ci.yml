# CI for every pull request to main. The job names are stable: harness, spec,
# checks, e2e and terraform are required status checks on main. The audit is
# not here: audit.yml runs it from main after this workflow succeeds on a
# feat/* PR, and reports it as the "audit" commit status.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/spec-lint/go.mod
          cache: false
      - run: make harness-test

  spec:
    name: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/spec-lint/go.mod
          cache: false
      - run: make spec-lint
      - name: Approved change files are unchanged
        run: tools/change-guard.sh origin/main

  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ hashFiles('src/api/go.mod') != '' && 'src/api/go.mod' || 'tools/spec-lint/go.mod' }}
          cache: false
      - uses: actions/setup-node@v7
        if: hashFiles('src/web/package-lock.json') != ''
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install web dependencies
        if: hashFiles('src/web/package-lock.json') != ''
        run: npm ci
        working-directory: src/web
      # Keep terraform_version equal to required_version in src/infra/**/versions.tf.
      - uses: hashicorp/setup-terraform@v4
        if: hashFiles('src/infra/**/*.tf') != ''
        with:
          terraform_version: 1.15.3
      - run: make check
      - run: make check-infra
      - run: make test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('src/e2e/package-lock.json') != ''
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/e2e/package-lock.json
      - name: Install e2e dependencies
        if: hashFiles('src/e2e/package-lock.json') != ''
        run: npm ci
        working-directory: src/e2e
      - name: Install Playwright browsers
        if: hashFiles('src/e2e/package-lock.json') != ''
        run: npx playwright install --with-deps chromium
        working-directory: src/e2e
      - run: make up
      - run: make e2e
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: make down

  # Plans production with the read-only plan role on every pull request. Only
  # src/infra/envs/production/ is planned here. src/infra/bootstrap/ is
  # applied once by hand (its README) and must never be planned in CI nor go
  # through plan-guard; make check-infra (checks job) validates it.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: src/infra/envs/production
    steps:
      - uses: actions/checkout@v7
      # OIDC: short-lived credentials, no stored keys. The role only reads,
      # plus the state lock file.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
      # Keep terraform_version equal to required_version in src/infra/**/versions.tf.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=5m -out=production.tfplan
      - name: Export the plan
        run: |
          terraform show -no-color production.tfplan > plan.txt
          terraform show -json production.tfplan > plan.json
      # Published before plan-guard, so a rejected plan can still be read.
      - uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: src/infra/envs/production/plan.txt
          if-no-files-found: error
      - name: plan-guard
        run: $GITHUB_WORKSPACE/tools/plan-guard.sh plan.json

